name: DailyPlan
options:
  bundleIdPrefix: com.snowball
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
targets:
  DailyPlan:
    type: application
    platform: iOS
    sources: [Shared, iPhone]
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: 每日计划
        UILaunchScreen: {}
        NSHealthShareUsageDescription: 你授权后读取健康数据，用于之后的训练与恢复分析。
        NSHealthUpdateUsageDescription: 你授权后保存明确记录的训练；首版不会自动写入。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowball.dailyplan
    dependencies:
      - target: DailyPlanWatch
        embed: true
  DailyPlanWatch:
    type: application
    platform: watchOS
    sources: [Shared/Models.swift, Shared/SyncJournal.swift, Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 每日计划
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: com.snowball.dailyplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowball.dailyplan.watch
schemes:
  DailyPlan:
    build:
      targets:
        DailyPlan: all
        DailyPlanWatch: all
