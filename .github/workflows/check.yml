name: Planner checks
on:
  push:
    branches: [main, feat/cloud-mobile-sync]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm web:build
